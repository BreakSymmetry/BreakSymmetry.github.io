name: Publish website

on:
  push:
    branches:
      - website
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-company-website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website source
        uses: actions/checkout@v6
        with:
          ref: website

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        run: npm run build:static
        env:
          NEXT_PUBLIC_SITE_VARIANT: net

      - name: Check out the GitHub Pages branch
        uses: actions/checkout@v6
        with:
          ref: master
          path: published-site

      - name: Update published files
        run: |
          rsync -a static-export/ published-site/
          mkdir -p published-site/.github/workflows
          cp .github/workflows/publish-github-pages.yml published-site/.github/workflows/publish-github-pages.yml

      - name: Publish when content changed
        working-directory: published-site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No published changes"
          else
            git commit -m "Publish company website"
            git push origin master
          fi
