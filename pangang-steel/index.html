<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>转炉炼钢 · 攀钢提钒炼钢流程 3D 演示</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--cyan:#4fe3ff;--cyan2:rgba(79,227,255,.18);--amber:#ffb15a;--hot:#ff7a2a;--ink:#e9edf1;--mute:#93a0ab;--glass:rgba(10,14,18,.72);--line:rgba(120,200,230,.22)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a1d18;color:var(--ink);font-family:"Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;overflow:hidden}
#app{position:fixed;inset:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;letter-spacing:.04em;color:var(--mute);padding:3px 8px;border:1px solid var(--line);background:rgba(8,12,16,.55);border-radius:3px;transition:color .3s,border-color .3s,opacity .3s}
.tag.active{color:var(--cyan);border-color:var(--cyan);background:rgba(8,20,26,.75)}
.tag::after{content:"";position:absolute;left:50%;top:100%;width:1px;height:14px;background:currentColor;opacity:.5}
.tag.dyn{color:#ffd2a6;border-color:rgba(255,160,80,.5);background:rgba(30,14,6,.7)}
.tag.dyn::after{display:none}
#title{position:absolute;left:18px;top:14px;pointer-events:none}
#title h1{margin:0;font-size:18px;font-weight:700;letter-spacing:.08em}
#title h1 span{color:var(--hot)}
#title p{margin:4px 0 0;font-size:12px;color:var(--mute);letter-spacing:.06em;font-family:"JetBrains Mono",monospace}
#panel{position:absolute;right:16px;top:14px;width:340px;max-height:calc(100% - 128px);overflow:auto;background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:16px 16px 14px;backdrop-filter:blur(6px)}
#panel .no{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--cyan);letter-spacing:.12em}
#panel h2{margin:2px 0 8px;font-size:20px;font-weight:700;letter-spacing:.04em}
#phase{font-size:14px;color:var(--amber);min-height:40px;line-height:1.45;padding:8px 10px;border-left:2px solid var(--hot);background:rgba(255,122,42,.07);margin-bottom:10px}
#desc{font-size:13px;line-height:1.7;color:#c9d1d8;margin:0 0 10px}
#look{margin:0 0 12px;padding-left:18px;font-size:12.5px;line-height:1.65;color:var(--mute)}
#badge{display:inline-block;font-size:11px;color:#1a0c04;background:var(--amber);padding:1px 7px;border-radius:2px;margin-left:6px;vertical-align:3px}
.gauges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.g{border:1px solid var(--line);border-radius:4px;padding:6px 6px 5px;background:rgba(0,0,0,.25)}
.g b{display:block;font-size:10.5px;color:var(--mute);font-weight:400}
.g i{font-style:normal;font-family:"JetBrains Mono",monospace;font-size:14px;color:var(--ink)}
.g.t i{color:var(--hot)}
#mat{font-size:12px;color:var(--mute);margin-top:8px;display:flex;justify-content:space-between}
#mat em{font-style:normal;color:var(--cyan)}
.note{font-size:11px;color:#6f7b85;margin-top:8px;line-height:1.5}
#bar{position:absolute;left:16px;right:16px;bottom:14px;background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:10px 12px;backdrop-filter:blur(6px)}
#pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.pill{font:inherit;font-size:12.5px;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:3px;padding:4px 9px;cursor:pointer}
.pill:hover{color:var(--ink);border-color:var(--mute)}
.pill.on{color:#071419;background:var(--cyan);border-color:var(--cyan)}
.row{display:flex;align-items:center;gap:10px}
.btn{font:inherit;font-size:14px;width:34px;height:30px;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:4px;cursor:pointer}
.btn:hover{border-color:var(--cyan);color:var(--cyan)}
#scrub{flex:1;accent-color:var(--hot)}
#clock{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--mute);min-width:96px;text-align:right}
select,label.ck{font:inherit;font-size:12px;color:var(--mute)}
select{background:#0e1317;border:1px solid var(--line);border-radius:4px;padding:4px}
label.ck{display:flex;align-items:center;gap:4px;cursor:pointer;white-space:nowrap}
#hint{position:absolute;left:18px;top:62px;font-size:11.5px;color:#6f7b85;pointer-events:none}
#sect{position:absolute;left:16px;bottom:112px;width:300px;background:var(--glass);border:1px solid var(--line);border-radius:6px;padding:8px 10px 6px;backdrop-filter:blur(6px);display:none}
#sect .st{font-size:12px;color:var(--cyan);letter-spacing:.06em;display:flex;justify-content:space-between}
#sect .st span{color:var(--mute);font-family:"JetBrains Mono",monospace}
#sc{display:block;width:280px;height:250px}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--mute);background:#0c0908;z-index:5}
#toggle{display:none}
@media (max-width:820px){
  #panel{left:10px;right:10px;width:auto;top:auto;bottom:168px;max-height:42%;padding:12px}
  #panel.min #desc,#panel.min #look,#panel.min .note,#panel.min .gauges,#panel.min #mat{display:none}
  #toggle{display:block;position:absolute;right:10px;top:8px;font:inherit;font-size:11px;color:var(--cyan);background:none;border:1px solid var(--line);border-radius:3px;padding:2px 6px}
  #bar{left:8px;right:8px;bottom:8px;padding:8px}
  .pill{font-size:11.5px;padding:3px 6px}
  #hint{display:none}
  #sect{left:8px;top:64px;bottom:auto;width:186px;padding:6px}
  #sc{width:170px;height:152px}
  #title h1{font-size:15px}
  .gauges{grid-template-columns:repeat(4,1fr)}
  .row{flex-wrap:wrap;gap:8px}
  #scrub{order:-1;flex-basis:100%}
  #clock{min-width:0;flex:1;text-align:left;white-space:nowrap;font-size:11px}
  #panel{max-height:36%}
}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="title">
    <h1>弄弄坪 · <span>提钒炼钢</span></h1>
    <p>PANGANG BOF LINE // V-EXTRACTION DUPLEX PROCESS</p>
  </div>
  <div id="sect"><div class="st"><b id="sectName" style="font-weight:500">剖面</b><span id="sectAng">0°</span></div><canvas id="sc"></canvas></div>
  <div id="hint">拖动旋转 · 右键/双指平移 · 滚轮缩放</div>
  <aside id="panel">
    <button id="toggle">收起</button>
    <div class="no" id="no">STAGE 01 / 07</div>
    <h2 id="name">铁水进站</h2>
    <div id="phase">—</div>
    <p id="desc"></p>
    <ul id="look"></ul>
    <div class="gauges">
      <div class="g t"><b>温度 °C</b><i id="gT">—</i></div>
      <div class="g"><b>碳 C %</b><i id="gC">—</i></div>
      <div class="g"><b>钒 V %</b><i id="gV">—</i></div>
      <div class="g"><b>硫 S %</b><i id="gS">—</i></div>
    </div>
    <div id="mat"><span>当前物料：<em id="mName">铁水</em></span><span id="mLoc"></span></div>
    <div class="note">读数为典型值示意，实际随炉次和钢种变化（例如重轨钢的碳含量约 0.7%，这里按低碳钢演示）。</div>
  </aside>
  <footer id="bar">
    <div id="pills"></div>
    <div class="row">
      <button class="btn" id="prev" title="上一步">⏮</button>
      <button class="btn" id="play" title="播放/暂停">❚❚</button>
      <button class="btn" id="next" title="下一步">⏭</button>
      <input type="range" id="scrub" min="0" max="100" step="0.01" value="0">
      <span id="clock">000.0 s</span>
      <select id="speed" title="速度"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="3">3×</option></select>
      <label class="ck"><input type="checkbox" id="follow" checked>跟随镜头</label>
    </div>
  </footer>
  <div id="loading">正在点火…</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
if(!window.THREE){ $('#loading').textContent='三维引擎加载失败，请检查网络后刷新。'; return; }
const V3=THREE.Vector3;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const sm=t=>t*t*(3-2*t);
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const es=(t,a,b)=>sm(seg(t,a,b));
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ---------------- 流程定义 ---------------- */
const STAGES=[
 {name:'铁水进站',dur:6,
  desc:'高炉炼出的铁水装进铁水罐，由机车推进炼钢厂。攀枝花的钒钛磁铁矿让这里的铁水天然含钒，约 0.3%。正因为有钒，攀钢比普通钢厂多出一道"提钒"工序。',
  look:['铁水约 1300°C，表面是暗橙色','背景里是高炉群，铁水从那里来'],
  phases:[[0,'机车推着铁水罐车进站']],
  cam:{p:[-25,11,32],t:[-40,3,8]}},
 {name:'铁水脱硫',dur:10,
  desc:'硫会让钢在热加工时开裂，所以要先去掉。这里用机械搅拌法示意：搅拌头插进铁水罐高速旋转，同时加入石灰基脱硫剂，硫从约 0.06% 降到 0.005% 以下。硫进了浮在表面的脱硫渣里，最后把铁水罐微微倾斜，用扒渣机把渣一耙一耙扒进渣罐。',
  look:['搅拌时铁水表面形成漩涡','扒渣：铁水罐倾斜，扒渣耙把表面的渣拨出去','脱硫渣如果留着，进转炉后硫会回到钢里'],
  phases:[[0,'铁水罐车开到脱硫站'],[2,'搅拌头下降，加入脱硫剂'],[3.5,'高速搅拌，铁水形成漩涡'],[8,'提起搅拌头'],[8.6,'倾斜铁水罐，扒渣机把浮渣扒进渣罐']],
  cam:{p:[-12,13,29],t:[-26,5,9]}},
 {name:'提钒转炉',dur:23,badge:'攀钢特色',
  desc:'第一次吹炼，目标不是炼钢而是"抢"钒。顶部氧枪吹入氧气，同时加冷却剂把温度压在较低区间。低温下钒比碳更容易被氧化，于是钒进入炉渣，大部分碳留在铁水里。产物有两样：钒渣（做钒产品的原料）和半钢。',
  look:['火焰比炼钢转炉小、偏红','出完半钢再从炉口倒出黑褐色的钒渣','钒渣罐由机车拉走，它是攀钢钒产品的原料'],
  phases:[[0,'铁水罐车开到提钒转炉'],[2,'天车吊起铁水罐，转炉向兑铁侧倾动'],[5,'兑铁水'],[8,'转炉摇正'],[9.5,'下氧枪，开始提钒吹炼'],[10.5,'吹氧中：钒先于碳被氧化，进入炉渣'],[15,'提氧枪，吹炼结束'],[16,'出半钢：转炉倒向出钢侧，半钢从出钢口流进罐里，钒渣浮在上面留在炉内'],[18.5,'翻转转炉，从炉口把钒渣倒进渣罐'],[20.5,'机车把钒渣罐拉走，送去加工钒产品']],
  cam:{p:[10,16,31],t:[-10,9,0]}},
 {name:'炼钢转炉',dur:35.5,
  desc:'半钢兑进炼钢转炉，再吹一次氧：把碳烧到钢的水平，同时去磷、升温。半钢里几乎没有硅、碳也偏低，热量不够，需要加复合造渣剂并适当补吹，这是攀钢"半钢炼钢"的难点。出钢时往钢包里加合金，出钢后先用留在炉里的渣溅渣护炉，再把剩余炉渣倒进渣罐，由机车拉去渣场。',
  look:['开吹后炉口火焰最猛、火花四溅','火焰变短变软，说明碳快烧完了','出钢 → 溅渣护炉 → 倒渣 → 渣罐拉走：一炉的收尾'],
  phases:[[0,'半钢罐车开到炼钢转炉跨'],[2.5,'天车吊运半钢罐，转炉倾动'],[5.5,'兑入半钢'],[8.5,'转炉摇正'],[10,'下氧枪，开吹'],[11,'吹炼：脱碳、升温，火焰最猛的阶段'],[12,'从高位料仓加入石灰等造渣料'],[17.5,'火焰变短变软：碳快烧完了，接近终点'],[20,'提枪'],[21,'倾炉测温取样'],[23.5,'出钢：钢水从出钢口流进钢包，同时加合金；末期挡渣，不让炉渣跟进钢包'],[27.5,'转炉摇正'],[28.5,'溅渣护炉：氮气把留在炉里的渣溅到炉衬上，保护耐火砖'],[30.8,'翻转转炉，倒掉剩余炉渣'],[33.5,'机车把钢渣罐拉去渣场']],
  cam:{p:[30,16,30],t:[10,9,0]}},
 {name:'LF 精炼',dur:10,
  desc:'钢包炉（LF）像一口带电极的锅盖：三根石墨电极插下来起弧加热，一边保温，一边按钢种加合金微调成分，并造白渣进一步脱硫，让钢水按时、按温度交给下一步。',
  look:['电弧闪烁，光偏蓝白','炉盖盖住钢包，减少散热'],
  phases:[[0,'钢包车开到 LF 工位'],[2.5,'炉盖下降'],[3.5,'石墨电极下降'],[4.5,'电弧加热，微调成分'],[8.5,'抬起电极和炉盖']],
  cam:{p:[39,12,15],t:[28,6,-3.4]}},
 {name:'RH 真空',dur:11,
  desc:'RH 真空处理：真空室下面的两根浸渍管插进钢水，抽真空后，往上升管里吹氩气，钢水被"提"进真空室，再从下降管流回钢包，不断循环。真空下氢、氮等气体被抽走，还能深度脱碳。重轨钢尤其要去氢，防止钢轨内部产生白点裂纹。',
  look:['钢包被顶起，浸渍管没入钢水','真空室里钢水翻滚，氩气泡一路上浮'],
  phases:[[0,'钢包车开到 RH 工位'],[2.5,'顶升钢包，浸渍管插入钢水'],[4,'抽真空、吹氩：钢水在真空室里循环脱气'],[9.5,'处理结束，降下钢包']],
  cam:{p:[53,13,15],t:[42,8,-3.4]}},
 {name:'连铸',dur:16,
  desc:'钢包吊上连铸机，钢水经中间包流进铜结晶器。结晶器通水冷却，钢水贴壁凝成一层坯壳，被连续向下拉出，沿弧形段一边喷水冷却一边矫直，最后火焰切割成定尺钢坯。攀钢有板坯和方坯连铸机，重轨钢就是先浇成方坯，再送去轧成百米钢轨。',
  look:['铸坯从亮橙色慢慢冷成暗红','切割时火花飞溅','1993 年，攀钢 1 号板坯连铸机热试成功'],
  phases:[[0,'钢包车开往连铸'],[2,'天车把钢包吊上连铸机'],[4.5,'开浇：钢包 → 中间包 → 结晶器'],[8,'铸坯拉出、矫直，火焰切割成定尺']],
  cam:{p:[84,16,24],t:[72,6,-3.4]}}
];
let acc=0; STAGES.forEach(s=>{s.start=acc;acc+=s.dur;});
const TOTAL=acc; const S=STAGES.map(s=>s.start);
const X={arrive:-40,kr:-26,cv:-10,cb:10,lf:28,rh:42,cc:58};
const ZT=-3.4, PIV=10, LH=4.3; /* 出钢侧轨道、转炉耳轴高度、钢包高度（米） */

/* 读数关键帧：时间, C, V, S, 温度 */
const KF=[
 [0,4.40,0.30,0.060,1310],[S[1]+3.5,4.40,0.30,0.060,1295],[S[1]+8,4.35,0.30,0.004,1280],
 [S[2]+10.5,4.35,0.30,0.004,1275],[S[2]+15,3.55,0.035,0.005,1380],[S[3]+11,3.50,0.035,0.006,1350],
 [S[3]+20,0.06,0.010,0.008,1660],[S[3]+27.5,0.07,0.010,0.008,1620],[S[4]+4.5,0.07,0.010,0.008,1585],
 [S[4]+8.5,0.07,0.010,0.004,1610],[S[5]+4,0.07,0.010,0.004,1600],[S[5]+9.5,0.03,0.010,0.003,1585],
 [S[6]+4.5,0.03,0.010,0.003,1570],[TOTAL,0.03,0.010,0.003,1545]];
function reading(T){
  for(let i=0;i<KF.length-1;i++){const a=KF[i],b=KF[i+1]; if(T<=b[0]){const k=seg(T,a[0],b[0]); return [1,2,3,4].map(j=>lerp(a[j],b[j],k));}}
  const l=KF[KF.length-1]; return [l[1],l[2],l[3],l[4]];
}

/* ---------------- 渲染器 ---------------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const scene=new THREE.Scene();
const BG=0x2a1d18;
scene.background=new THREE.Color(BG);
scene.fog=new THREE.Fog(BG,90,300);
const camera=new THREE.PerspectiveCamera(45,1,0.1,800);
camera.position.set(-25,11,32);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=0.08; controls.maxPolarAngle=1.48;
controls.minDistance=5; controls.maxDistance=140; controls.target.set(-40,3,8);

let composer=null,bloom=null;
if(THREE.EffectComposer&&THREE.RenderPass&&THREE.UnrealBloomPass){
  try{
    composer=new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene,camera));
    bloom=new THREE.UnrealBloomPass(new THREE.Vector2(512,512),0.9,0.5,0.55);
    composer.addPass(bloom);
  }catch(e){composer=null;}
}

/* ---------------- 灯光 ---------------- */
scene.add(new THREE.HemisphereLight(0x7f97a6,0x3a2216,1.9));

function PSys(n,additive){
  this.n=n; this.cur=0;
  this.pos=new Float32Array(n*3); this.col=new Float32Array(n*3); this.size=new Float32Array(n); this.alpha=new Float32Array(n);
  this.vel=new Float32Array(n*3); this.life=new Float32Array(n); this.max=new Float32Array(n);
  this.c0=new Float32Array(n*3); this.c1=new Float32Array(n*3); this.s0=new Float32Array(n); this.s1=new Float32Array(n);
  this.gr=new Float32Array(n); this.dr=new Float32Array(n); this.a0=new Float32Array(n);
  const g=new THREE.BufferGeometry();
  this.aPos=new THREE.BufferAttribute(this.pos,3); this.aCol=new THREE.BufferAttribute(this.col,3);
  this.aSize=new THREE.BufferAttribute(this.size,1); this.aAlpha=new THREE.BufferAttribute(this.alpha,1);
  [this.aPos,this.aCol,this.aSize,this.aAlpha].forEach(a=>a.setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('position',this.aPos); g.setAttribute('pcolor',this.aCol); g.setAttribute('size',this.aSize); g.setAttribute('alpha',this.aAlpha);
  this.mat=new THREE.ShaderMaterial({
    uniforms:{uScale:{value:600}},
    vertexShader:'attribute float size;attribute float alpha;attribute vec3 pcolor;varying vec3 vC;varying float vA;uniform float uScale;void main(){vC=pcolor;vA=alpha;vec4 mv=modelViewMatrix*vec4(position,1.0);gl_PointSize=size*uScale/max(0.5,-mv.z);gl_Position=projectionMatrix*mv;}',
    fragmentShader:'varying vec3 vC;varying float vA;void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);if(r>0.5)discard;float a=vA*pow(1.0-r*2.0,1.5);gl_FragColor=vec4(vC,a);}',
    transparent:true,depthWrite:false,blending:additive?THREE.AdditiveBlending:THREE.NormalBlending
  });
  this.points=new THREE.Points(g,this.mat); this.points.frustumCulled=false; scene.add(this.points);
}
PSys.prototype.emit=function(p,v,life,c0,c1,s0,s1,gr,dr,a0){
  const i=this.cur; this.cur=(this.cur+1)%this.n; const i3=i*3;
  this.pos[i3]=p.x;this.pos[i3+1]=p.y;this.pos[i3+2]=p.z;
  this.vel[i3]=v.x;this.vel[i3+1]=v.y;this.vel[i3+2]=v.z;
  this.life[i]=life;this.max[i]=life;
  this.c0[i3]=c0[0];this.c0[i3+1]=c0[1];this.c0[i3+2]=c0[2];
  this.c1[i3]=c1[0];this.c1[i3+1]=c1[1];this.c1[i3+2]=c1[2];
  this.s0[i]=s0;this.s1[i]=s1;this.gr[i]=gr;this.dr[i]=dr;this.a0[i]=a0;
};
PSys.prototype.update=function(dt){
  for(let i=0;i<this.n;i++){
    if(this.life[i]<=0){this.alpha[i]=0;continue;}
    this.life[i]-=dt;
    if(this.life[i]<=0){this.alpha[i]=0;continue;}
    const i3=i*3,k=1-this.life[i]/this.max[i],damp=Math.max(0,1-this.dr[i]*dt);
    this.vel[i3+1]+=this.gr[i]*dt;
    this.vel[i3]*=damp;this.vel[i3+1]*=damp;this.vel[i3+2]*=damp;
    this.pos[i3]+=this.vel[i3]*dt;this.pos[i3+1]+=this.vel[i3+1]*dt;this.pos[i3+2]+=this.vel[i3+2]*dt;
    for(let j=0;j<3;j++) this.col[i3+j]=this.c0[i3+j]+(this.c1[i3+j]-this.c0[i3+j])*k;
    this.size[i]=this.s0[i]+(this.s1[i]-this.s0[i])*k;
    this.alpha[i]=this.a0[i]*Math.min(1,k*10)*Math.pow(1-k,0.8);
  }
  this.aPos.needsUpdate=this.aCol.needsUpdate=this.aSize.needsUpdate=this.aAlpha.needsUpdate=true;
};

function flames(m,I,hot){

function dust(from,to,I,c){

function polyArea(p){let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a[0]*b[1]-b[0]*a[1];}return Math.abs(s)/2;}

}

/* ---------------- UI ---------------- */
const pillsEl=$('#pills');
const pills=STAGES.map((s,i)=>{const b=document.createElement('button');b.className='pill';b.textContent=(i+1)+' '+s.name;b.onclick=()=>{T=s.start+0.001;tweenTo(i);};pillsEl.appendChild(b);return b;});
const scrub=$('#scrub'); scrub.max=TOTAL;
let T=0, playing=true, speed=1, curStage=-1, scrubbing=false;
function stageAt(t){ for(let i=STAGES.length-1;i>=0;i--) if(t>=STAGES[i].start) return i; return 0; }
function phaseAt(i,t){ const ph=STAGES[i].phases; let txt=ph[0][1]; for(const p of ph) if(t-STAGES[i].start>=p[0]) txt=p[1]; return txt; }
$('#play').onclick=()=>{playing=!playing;$('#play').textContent=playing?'❚❚':'▶';};
$('#prev').onclick=()=>{const i=stageAt(T);const j=(T-STAGES[i].start<1.5&&i>0)?i-1:i;T=STAGES[j].start+0.001;tweenTo(j);};
$('#next').onclick=()=>{const j=(stageAt(T)+1)%STAGES.length;T=STAGES[j].start+0.001;tweenTo(j);};
$('#speed').onchange=e=>{speed=parseFloat(e.target.value);};
scrub.addEventListener('input',()=>{T=parseFloat(scrub.value);scrubbing=true;});
scrub.addEventListener('change',()=>{scrubbing=false;});
$('#toggle').onclick=()=>{const p=$('#panel');p.classList.toggle('min');$('#toggle').textContent=p.classList.contains('min')?'展开':'收起';};
let tween=null;
function tweenTo(i){
  if(!$('#follow').checked) return;
  const c=STAGES[i].cam;
  tween={t:0,p0:camera.position.clone(),t0:controls.target.clone(),p1:new V3(...c.p),t1:new V3(...c.t)};
}
controls.addEventListener('start',()=>{tween=null;});
function setStageUI(i){
  const s=STAGES[i];
  pills.forEach((p,j)=>p.classList.toggle('on',j===i));
  stationTags.forEach(t=>t.el.classList.toggle('active',t.i===i));
  $('#no').textContent='STAGE '+String(i+1).padStart(2,'0')+' / '+String(STAGES.length).padStart(2,'0');
  $('#name').innerHTML=s.name+(s.badge?'<span id="badge">'+s.badge+'</span>':'');
  $('#desc').textContent=s.desc;
  $('#look').innerHTML=s.look.map(x=>'<li>'+x+'</li>').join('');
}
function matName(t){
  if(t<S[2]+17) return '铁水';
  if(t<S[3]+24.5) return '半钢';
  if(t<S[6]+8.2) return '钢水';
  return '钢水 → 铸坯';
}
const proj=new V3();
function updateLabels(T){
  const w=canvas.clientWidth,h=canvas.clientHeight;
  const place=(el,p,show)=>{
    if(!show){el.style.opacity=0;return;}
    proj.copy(p).project(camera);
    if(proj.z>1||proj.z<-1){el.style.opacity=0;return;}
    el.style.opacity=1; el.style.left=((proj.x+1)/2*w)+'px'; el.style.top=((1-proj.y)/2*h)+'px';
  };
  stationTags.forEach(t=>place(t.el,t.p,true));
  dyn.forEach(d=>place(d.el,d.posFn(),d.showFn(T)));
}

function resize(){
  const w=window.innerWidth,h=window.innerHeight;
  renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();
  if(composer){ composer.setSize(w,h); if(composer.setPixelRatio) composer.setPixelRatio(renderer.getPixelRatio()); }
  const sc=h*renderer.getPixelRatio()/(2*Math.tan(camera.fov*Math.PI/360));
  FX.mat.uniforms.uScale.value=sc; SM.mat.uniforms.uScale.value=sc;
}
window.addEventListener('resize',resize); resize();

let last=performance.now();
function frame(now){
  const rdt=Math.min(0.05,(now-last)/1000); last=now;
  DT=playing&&!scrubbing?rdt*speed:0;
  T+=DT; if(T>=TOTAL) T=0;
  const si=stageAt(T);
  if(si!==curStage){ curStage=si; setStageUI(si); if(DT>0) tweenTo(si); }
  update(T);
  FX.update(DT); SM.update(DT);
  if(tween){ tween.t=Math.min(1,tween.t+rdt/1.8); const k=sm(tween.t); camera.position.lerpVectors(tween.p0,tween.p1,k); controls.target.lerpVectors(tween.t0,tween.t1,k); if(tween.t>=1) tween=null; }
  controls.update();
  $('#phase').textContent=phaseAt(si,T);
  const r=reading(T);
  $('#gT').textContent=Math.round(r[3]); $('#gC').textContent=r[0].toFixed(2); $('#gV').textContent=r[1].toFixed(3); $('#gS').textContent=r[2].toFixed(3);
  $('#mName').textContent=matName(T);
  if(!scrubbing) scrub.value=T;
  $('#clock').textContent=T.toFixed(1).padStart(5,'0')+' / '+TOTAL+' s';
  updateLabels(T);
  drawSection(SECT,T);
  if(composer) composer.render(); else renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
if(window.innerWidth<820){$('#panel').classList.add('min');$('#toggle').textContent='展开';}
tweenTo(0);
$('#loading').style.display='none';
window.__demo={setT:v=>{T=v;},pause:()=>{playing=false;},STAGES,TOTAL};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
